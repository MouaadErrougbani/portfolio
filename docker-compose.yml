services:

  postgres:
    image: postgres:17

    container_name: portfolio-postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ${PRIVATE_NETWORK}


  redis:
    image: redis:8-alpine

    container_name: portfolio-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - ${PRIVATE_NETWORK}


  pgadmin:
    image: dpage/pgadmin4

    container_name: portfolio-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mouaad-erg.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - ${PRIVATE_NETWORK}
      - ${PUBLIC_NETWORK}


  backend:
    build:
      context: ./backend

    container_name: portfolio-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - redis

    networks:
      - ${PRIVATE_NETWORK}
      - ${PUBLIC_NETWORK}


  frontend:
    build:
      context: ./frontend

    container_name: portfolio-frontend

    restart: unless-stopped

    networks:
      - ${PUBLIC_NETWORK}



volumes:

  postgres_data:
  redis_data:
  pgadmin_data:


networks:

  ${PUBLIC_NETWORK}:
    external: true

  ${PRIVATE_NETWORK}:
    external: true